name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Only Chromium — the walk never uses the other engines, and installing
      # all three roughly triples the slowest step in this job.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: ./scripts/verify.sh
